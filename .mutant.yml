---
usage: opensource
includes:
  - lib
requires:
  - odata_duty
integration:
  name: rspec
environment_variables:
  MUTANT: "true"
matcher:
  subjects:
    - OdataDuty*
  # Mutation-testing debt ratchet (like .rubocop_todo.yml): subjects below had surviving
  # mutations when CI was made blocking. When you touch one, delete its entry and kill the
  # survivors (see spec/using_mutant.md). Never add entries.
  ignore:
    - "OdataDuty::MapperBuilder#confirm_boolean"
    - "OdataDuty::MapperBuilder#confirm_one_of"
    - "OdataDuty::MapperBuilder#obj_to_base_hash"
    - "OdataDuty::MapperBuilder#obj_to_hash"
    - "OdataDuty::MapperBuilder.build_class"
    - "OdataDuty::MapperBuilder.eval_erb_class"
    - "OdataDuty::McpInputSchemas#create_input_schema"
    - "OdataDuty::McpInputSchemas#delete_input_schema"
    - "OdataDuty::McpInputSchemas#search_input_schema"
    - "OdataDuty::McpInputSchemas#update_input_schema"
    - "OdataDuty::McpServerBuilder#build"
    - "OdataDuty::McpServerBuilder#count_resource"
    - "OdataDuty::McpServerBuilder#define_tool"
    - "OdataDuty::McpServerBuilder#direct_resources"
    - "OdataDuty::McpServerBuilder#read_resource"
    - "OdataDuty::McpServerBuilder#register_create_tool"
    - "OdataDuty::McpServerBuilder#register_delete_tool"
    - "OdataDuty::McpServerBuilder#register_endpoint_tools"
    - "OdataDuty::McpServerBuilder#register_key_tool"
    - "OdataDuty::McpServerBuilder#register_resources_read"
    - "OdataDuty::McpServerBuilder#register_search_tool"
    - "OdataDuty::McpServerBuilder#register_update_tool"
    - "OdataDuty::McpServerBuilder#resource_templates"
    - "OdataDuty::McpServerBuilder#run_tool"
    - "OdataDuty::McpServerBuilder#templates_for_endpoint"
    - "OdataDuty::Property.new"
    - "OdataDuty::Property.resolve_mutability"
    - "OdataDuty::Property.valid_name?"
    - "OdataDuty::Property::CollectionProp#convert"
    - "OdataDuty::Property::SingleProp#calling_method?"
    - "OdataDuty::Property::SingleProp#collection?"
    - "OdataDuty::Property::SingleProp#convert"
    - "OdataDuty::Property::SingleProp#filter_convert"
    - "OdataDuty::Property::SingleProp#initialize"
    - "OdataDuty::Property::SingleProp#load_type_instance_vars"
    - "OdataDuty::Property::SingleProp#to_oas2_type"
    - "OdataDuty::Property::SingleProp#to_value"
