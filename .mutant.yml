---
usage: opensource
includes:
  - lib
requires:
  - odata_duty
integration:
  name: rspec
environment_variables:
  MUTANT: "true"
matcher:
  subjects:
    - OdataDuty*
  # Mutation-testing debt ratchet (like .rubocop_todo.yml): subjects below had surviving
  # mutations when CI was made blocking. When you touch one, delete its entry and kill the
  # survivors (see spec/using_mutant.md). Never add entries.
  #
  # The three MCP entries below are NOT debt: each has only equivalent mutants at the MCP SDK
  # boundary that no public-API test can distinguish (a required key/context is always present, and
  # an OdataDuty::Error renders identically to its message). See the comment on each method.
  ignore:
    - "OdataDuty::McpServerBuilder#keyed_url_for"   # args[key] vs args.fetch(key)
    - "OdataDuty::McpServerBuilder#define_tool"     # server_context[:context] vs .fetch/.dig
    - "OdataDuty::McpServerBuilder#run_tool"        # e.message vs e
