name: Dev Container

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Build context is .devcontainer/ so the Dockerfile's `COPY git-hooks-dispatcher.sh` resolves.
    # Build the image's vscode user at the runner's UID/GID, the way start.sh does on Linux, so
    # the steps below can run as that user against a bind mount the runner owns.
    - name: Build dev container image
      run: |
        docker build -t odata_duty-devcontainer \
          --build-arg USER_UID="$(id -u)" \
          --build-arg USER_GID="$(id -g)" \
          .devcontainer

    # Mount the checked-out repo and run the lifecycle scripts devcontainer.json and
    # .devcontainer/start.sh both run, which is what proves the image can provision a
    # workspace (Ruby, gems, agent-apropos index). As the image's default vscode user, since
    # both real entry paths provision as vscode — running this as root would let permissions
    # that break a real container pass here.
    - name: Run the devcontainer lifecycle scripts in the image
      run: |
        docker run --rm \
          --entrypoint bash \
          -v "${{ github.workspace }}:/workspace" \
          -w /workspace \
          odata_duty-devcontainer \
          -c ".devcontainer/postCreateCommand.sh && .devcontainer/postStartCommand.sh && claude --version"

    # The Claude Code hooks in .claude/ are shell, so `bundle exec rake` never sees them.
    # Running their bats suite in the image also proves the image still ships bats and jq,
    # which the hooks depend on — without jq they fall back to a coarser match.
    - name: Run the Claude Code hook tests in the image
      run: |
        docker run --rm \
          --entrypoint bash \
          -v "${{ github.workspace }}:/workspace" \
          -w /workspace \
          odata_duty-devcontainer \
          -c "bats .claude/hooks/*.bats"
