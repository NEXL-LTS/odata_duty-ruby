# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will download a prebuilt Ruby version, install dependencies and run tests with Rake
# For more information see: https://github.com/marketplace/actions/setup-ruby-jruby-and-truffleruby

name: Ruby

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ['3.2', '3.3', '3.4', '4.0']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Ruby
    # To automatically get bug fixes and new Ruby versions for ruby/setup-ruby,
    # change this to (see https://github.com/ruby/setup-ruby#versioning):
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true # runs 'bundle install' and caches installed gems automatically
    # run tests multiple times in an attempt to cache flaky test failures
    - name: Run tests
      run: bundle exec rake
    - name: Run tests
      run: bundle exec rake
    - name: Run tests
      run: bundle exec rake
    - name: Run tests
      run: bundle exec rake

  # Mutation-tests only the subjects touched by the PR (see spec/using_mutant.md).
  # Blocking: pre-existing debt is ratcheted via matcher.ignore in .mutant.yml,
  # so any surviving mutation here was introduced (or adopted) by the PR.
  mutation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # mutant --since needs history to find the merge base
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true
    - name: Run mutation tests on changed code
      run: bundle exec mutant run --since "origin/${{ github.base_ref }}"
