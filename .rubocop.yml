require:
  - ./rubocop/cop/odata_duty/public_api_only.rb

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.2
  Exclude:
    - "vendor/**/*"
    - "tmp/**/*"
    - "bin/**"
    - "coverage/**/*"
    - "sorbet/**/*"
    - "**/sorbet/**/*"

Metrics/AbcSize:
  Max: 30
Metrics/ParameterLists:
  CountKeywordArgs: false
Metrics/ClassLength:
  Max: 99
Metrics/ModuleLength:
  Max: 99
Metrics/CyclomaticComplexity:
  Max: 7
Metrics/MethodLength:
  Max: 13
Style/FrozenStringLiteralComment:
  Enabled: false
Style/Documentation:
  Enabled: false
Layout/LineEndStringConcatenationIndentation:
  Enabled: false
Layout/LineLength:
  Max: 99
  AllowedPatterns: ['\A#']

Style/AccessorGrouping:
  Enabled: false

# `extend self` keeps module methods as single, mutation-testable definitions;
# `module_function` creates a private-instance/singleton pair that mutant cannot cover.
# Only enforced for lib/ (mutation-tested); spec helper modules may use either.
Style/ModuleFunction:
  EnforcedStyle: extend_self
  Exclude:
    - 'spec/**/*'

Lint/ConstantDefinitionInBlock:
  Enabled: false

Gemspec/AttributeAssignment:
  Enabled: false

OdataDuty/PublicApiOnly:
  Enabled: true
  Namespace: OdataDuty
  Include:
    - 'spec/**/*_spec.rb'
  AllowedConstants:
    - OdataDuty::EntityType
    - OdataDuty::ComplexType
    - OdataDuty::EnumType
    - OdataDuty::EntitySet
    - OdataDuty::SetResolver
    - OdataDuty::Schema
    - OdataDuty::SchemaBuilder
    - OdataDuty::EdmxSchema
    - OdataDuty::OAS2
    - OdataDuty::SearchExpression
    - OdataDuty::SearchTerm
    - OdataDuty::Generators::InstallGenerator
    - OdataDuty::Generators::EntitySetGenerator
  AllowedConstantPatterns:
    - '\AOdataDuty::\w*Error\z'
    - '\AOdataDuty::Invalid\w+\z'
